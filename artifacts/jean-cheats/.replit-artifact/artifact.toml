kind = "web"
previewPath = "/"
title = "Jean Cheats"
version = "1.0.0"
id = "artifacts/jean-cheats"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24252

[services.development]
run = "pnpm --filter @workspace/jean-cheats run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jean-cheats", "run", "build" ]
publicDir = "artifacts/jean-cheats/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24252"
BASE_PATH = "/"
